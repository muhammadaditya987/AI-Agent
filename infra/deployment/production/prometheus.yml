global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: ai-agency-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:3000

  - job_name: n8n
    metrics_path: /metrics
    static_configs:
      - targets:
          - n8n:5678

  - job_name: n8n-worker
    metrics_path: /metrics
    static_configs:
      - targets:
          - n8n-worker:5678

  - job_name: loki
    static_configs:
      - targets:
          - loki:3100

  - job_name: alloy
    static_configs:
      - targets:
          - alloy:12345
